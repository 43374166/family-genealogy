name: iOS unsigned package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS artifact
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter --no-version-check pub get

      - name: Build unsigned iOS app
        run: flutter --no-version-check build ios --release --no-codesign --build-number "${{ github.run_number }}"

      - name: Package unsigned IPA and app archive
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-root/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa-root/Payload/Runner.app"
          (
            cd "$RUNNER_TEMP/ipa-root"
            zip -qry "$GITHUB_WORKSPACE/apps/mobile/build/ios/Runner-unsigned.ipa" Payload
          )
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "build/ios/Runner-unsigned.app.zip"
          shasum -a 256 build/ios/Runner-unsigned.ipa \
            build/ios/Runner-unsigned.app.zip | tee build/ios/SHA256SUMS.txt

      - name: Add build note
        run: |
          {
            echo "## iOS unsigned build"
            echo ""
            echo "- Flutter: 3.35.5"
            echo "- Runner: $GITHUB_SHA"
            echo "- Package: **unsigned** (no Apple signing certificate applied)"
            echo ""
            echo "The IPA cannot be installed on a normal iPhone or uploaded to TestFlight"
            echo "until it is signed with an Apple Developer certificate and provisioning profile."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-ios-unsigned-${{ github.run_number }}
          path: |
            apps/mobile/build/ios/Runner-unsigned.ipa
            apps/mobile/build/ios/Runner-unsigned.app.zip
            apps/mobile/build/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish unsigned IPA release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-build-${{ github.run_number }}
          name: iOS unsigned build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Unsigned iOS build produced by GitHub Actions.

            - Flutter 3.35.5 / macOS 15
            - No Apple signing certificate or provisioning profile applied
            - The IPA must be signed before normal iPhone installation
            - Includes SHA256SUMS.txt for integrity verification
          files: |
            apps/mobile/build/ios/Runner-unsigned.ipa
            apps/mobile/build/ios/Runner-unsigned.app.zip
            apps/mobile/build/ios/SHA256SUMS.txt
