name: backend

on:
  push:
    paths:
      - "server/**"
      - "packages/api-contracts/**"
      - "docs/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "packages/api-contracts/**"
      - "docs/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: family_tree_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d family_tree_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_tree_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_tree_test?sslmode=disable

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Apply migrations to clean PostgreSQL
        run: go run ./cmd/migrate up

      - name: Run tests including PostgreSQL constraints
        run: go test -race -count=1 ./...
