name: backend

on:
  push:
    paths:
      - "server/**"
      - "packages/api-contracts/**"
      - "docs/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "packages/api-contracts/**"
      - "docs/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: family_tree_test
          MYSQL_USER: familytree
          MYSQL_PASSWORD: familytree
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false
      DATABASE_DSN: familytree:familytree@tcp(127.0.0.1:3306)/family_tree_test?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      TEST_DATABASE_DSN: familytree:familytree@tcp(127.0.0.1:3306)/family_tree_test?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Apply MySQL migrations to clean database
        run: |
          set +e
          go run ./cmd/migrate up > /tmp/mysql-migrate.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 40 /tmp/mysql-migrate.log
            tail -n 15 /tmp/mysql-migrate.log | while IFS= read -r line; do
              echo "::error title=MySQL migration::${line}"
            done
            exit "$code"
          fi
          cat /tmp/mysql-migrate.log

      - name: Run tests including MySQL constraints
        run: go test -race -count=1 ./...

  postgres-reference:
    name: postgres-17-design-reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: family_tree_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d family_tree_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply preserved PostgreSQL 17 design
        env:
          PGPASSWORD: postgres
        run: |
          sed '/-- +goose Down/,$d' server/internal/database/migrations/postgres/00001_init.sql > /tmp/postgres-up.sql
          psql -h localhost -U postgres -d family_tree_test -v ON_ERROR_STOP=1 -f /tmp/postgres-up.sql
          psql -h localhost -U postgres -d family_tree_test -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) AS core_tables FROM information_schema.tables WHERE table_schema='public';"
