name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter --no-version-check pub get

      # No production key.properties exists in CI. Flutter/Gradle falls back to
      # the debug signing key, which is fine for a directly installable test APK.
      - name: Build test APK
        run: >
          flutter --no-version-check build apk --release
          --build-number "${{ github.run_number }}"
          --dart-define=API_BASE_URL=https://family.fishdream.xyz:10443

      - name: Package test APK
        run: |
          set -euo pipefail
          mkdir -p build/test-apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/test-apk/familytree-test-${{ github.run_number }}-${{ github.run_attempt }}.apk"
          cd build/test-apk
          sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Add build note
        run: |
          {
            echo "## Android test APK"
            echo ""
            echo "- Flutter: 3.35.5"
            echo "- Commit: $GITHUB_SHA"
            echo "- API: https://family.fishdream.xyz:10443"
            echo "- Signing: debug/test key (not for production)"
            echo "- Install with: adb install -r <file>.apk"
            echo ""
            echo "If an older build was signed with a different debug key, uninstall it first."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: familytree-android-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            apps/mobile/build/test-apk/*.apk
            apps/mobile/build/test-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Android test build ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Installable Android test build produced by GitHub Actions.

            - API: https://family.fishdream.xyz:10443
            - Includes the Web QR sign-in flow
            - Signed with a debug/test key, not a production release key
            - If Android reports a signature conflict, uninstall the old app first
            - Includes SHA256SUMS.txt for integrity verification
          files: |
            apps/mobile/build/test-apk/*.apk
            apps/mobile/build/test-apk/SHA256SUMS.txt
