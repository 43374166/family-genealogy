name: family-tree

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: familytree
      MYSQL_USER: familytree
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in server/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in server/.env}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--skip-log-bin"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_DSN: familytree:${MYSQL_PASSWORD}@tcp(db:3306)/familytree?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DATABASE_DSN: familytree:${MYSQL_PASSWORD}@tcp(db:3306)/familytree?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      DB_MAX_CONNS: "10"
      SHUTDOWN_TIMEOUT: 15s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
