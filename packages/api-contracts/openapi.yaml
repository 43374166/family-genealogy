openapi: 3.1.0
info:
  title: 家族族谱 API
  version: 1.0.0
  description: |
    多家族族谱产品的 v1 契约。契约先行，服务端实现必须与此一致。

    当前后端已实现登录、当前账户/家庭、族谱树、人物查询和人物详情；资料申请与审核
    接口仍按本契约逐步实现。所有时间使用 RFC 3339 UTC；错误使用 RFC 9457
    `application/problem+json`；JSON 字段使用 camelCase。
  contact:
    name: Family Tree API
servers:
  - url: http://localhost:8080
    description: 本地开发
  - url: https://api.example.invalid
    description: 生产占位地址（部署时替换）
tags:
  - name: system
  - name: auth
  - name: family
  - name: tree
  - name: person
  - name: review
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getLiveness
      summary: 存活检查
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: 就绪检查（含数据库）
      security: []
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    const: ok
                  database:
                    type: string
                    const: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/meta:
    get:
      tags: [system]
      operationId: getMeta
      summary: 服务版本信息
      security: []
      responses:
        "200":
          description: 构建信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；令牌只在响应中出现一次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 撤销当前会话
      responses:
        "204":
          description: 已撤销
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前账户与当前家族身份
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/family:
    get:
      tags: [family]
      operationId: getCurrentFamily
      summary: 当前家族空间
      responses:
        "200":
          description: 当前家族
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: 族谱树
      parameters:
        - name: generation
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 99
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
        - name: focusPersonId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 树节点与关系
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/persons:
    get:
      tags: [person]
      operationId: listPersons
      summary: 查询人物
      parameters:
        - name: q
          in: query
          description: 姓名、字号、别名模糊搜索
          schema:
            type: string
            maxLength: 80
        - name: generation
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 99
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 人物分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/persons/{personId}:
    get:
      tags: [person]
      operationId: getPerson
      summary: 人物详情
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: 人物档案
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/edit-requests:
    get:
      tags: [review]
      operationId: listMyEditRequests
      summary: 我提交的资料申请
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EditRequestStatus"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 申请分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditRequestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [review]
      operationId: createEditRequest
      summary: 提交资料申请
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEditRequest"
      responses:
        "201":
          description: 已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/edit-requests/{requestId}/review:
    post:
      tags: [review]
      operationId: reviewEditRequest
      summary: 审核申请（owner/admin）
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: 登录返回的不透明会话令牌；服务端只保存哈希。
  parameters:
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 权限不足
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 资源不存在或不在当前家族
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: 版本冲突、重复申请或状态不允许
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: 字段校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: 登录尝试过多
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: 依赖不可用
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 稳定机器码，例如 FAMILY_NOT_FOUND
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    BuildInfo:
      type: object
      required: [service, version, commit, buildTime, apiVersion]
      properties:
        service:
          type: string
          const: family-tree-api
        version:
          type: string
        commit:
          type: string
        buildTime:
          type: string
          format: date-time
        apiVersion:
          type: string
          const: v1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 8
          maxLength: 256
    Session:
      type: object
      required: [token, expiresAt, user, family]
      properties:
        token:
          type: string
          description: 只在登录响应中返回；客户端存入安全存储
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        family:
          $ref: "#/components/schemas/Family"
    User:
      type: object
      required: [id, displayName, loginName, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        loginName:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
    UserStatus:
      type: string
      enum: [active, disabled, pending]
    Me:
      type: object
      required: [user, membership, family]
      properties:
        user:
          $ref: "#/components/schemas/User"
        membership:
          $ref: "#/components/schemas/Membership"
        family:
          $ref: "#/components/schemas/Family"
    Membership:
      type: object
      required: [id, role, status, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        personId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time
    MembershipRole:
      type: string
      enum: [owner, admin, member]
    MembershipStatus:
      type: string
      enum: [active, invited, revoked]
    Family:
      type: object
      required: [id, name, surname, region, memberCount, branchCount, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        surname:
          type: string
        motto:
          type: string
        region:
          type: string
        description:
          type: string
        memberCount:
          type: integer
          minimum: 0
        branchCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, archived]
    Branch:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
    PartialDate:
      type: object
      description: |
        只填已知精度。只知道年时 month/day 省略；农历闰月用 isLeapMonth。
        text 保留族谱原文，例如“康熙二十一年壬戌”。
      additionalProperties: false
      properties:
        year:
          type: integer
          minimum: 1
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        calendar:
          type: string
          enum: [gregorian, lunar, unknown]
        isLeapMonth:
          type: boolean
        text:
          type: string
          maxLength: 80
    Gender:
      type: string
      enum: [male, female, other, unknown]
    LifeStatus:
      type: string
      enum: [living, deceased, unknown]
    PersonStatus:
      type: string
      enum: [active, merged, archived]
    PersonSummary:
      type: object
      required: [id, fullName, surname, givenName, gender, generationNo, status]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        surname:
          type: string
        givenName:
          type: string
        courtesyName:
          type: string
        alias:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        generationNo:
          type: integer
        generationLabel:
          type: string
        branchId:
          type: string
          format: uuid
        birth:
          $ref: "#/components/schemas/PartialDate"
        death:
          $ref: "#/components/schemas/PartialDate"
        lifeStatus:
          $ref: "#/components/schemas/LifeStatus"
        relationLabel:
          type: string
        status:
          $ref: "#/components/schemas/PersonStatus"
        version:
          type: integer
          minimum: 1
    Person:
      allOf:
        - $ref: "#/components/schemas/PersonSummary"
        - type: object
          properties:
            birthPlace:
              type: string
            residence:
              type: string
            occupation:
              type: string
            education:
              type: string
            biography:
              type: string
            parents:
              type: array
              items:
                $ref: "#/components/schemas/Relative"
            children:
              type: array
              items:
                $ref: "#/components/schemas/Relative"
            spouses:
              type: array
              items:
                $ref: "#/components/schemas/Relative"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    Relative:
      type: object
      required: [personId, fullName, relation]
      properties:
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        relation:
          type: string
    PersonPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonSummary"
        nextCursor:
          type: [string, "null"]
    ParentChildEdge:
      type: object
      required: [id, parentId, childId, parentRole, status]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        parentRole:
          type: string
          enum: [father, mother, parent, adoptive, step, guardian]
        status:
          type: string
          enum: [active, ended]
    SpouseEdge:
      type: object
      required: [id, personAId, personBId, status]
      properties:
        id:
          type: string
          format: uuid
        personAId:
          type: string
          format: uuid
        personBId:
          type: string
          format: uuid
        status:
          type: string
          enum: [married, divorced, widowed, unknown]
        startYear:
          type: integer
        endYear:
          type: integer
    Tree:
      type: object
      required: [familyId, version, persons, parentChild, spouses]
      properties:
        familyId:
          type: string
          format: uuid
        version:
          type: integer
        persons:
          type: array
          items:
            $ref: "#/components/schemas/PersonSummary"
        parentChild:
          type: array
          items:
            $ref: "#/components/schemas/ParentChildEdge"
        spouses:
          type: array
          items:
            $ref: "#/components/schemas/SpouseEdge"
    EditRequestType:
      type: string
      enum:
        - create_person
        - update_person
        - archive_person
        - add_parent_child
        - end_parent_child
        - add_spouse
        - end_spouse
    EditRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    CreateEditRequest:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type:
          $ref: "#/components/schemas/EditRequestType"
        targetPersonId:
          type: string
          format: uuid
        baseVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          description: 按 type 使用对应字段；服务端做 JSON Schema/业务校验
          additionalProperties: true
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 2000
    EditRequest:
      type: object
      required: [id, type, status, payload, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EditRequestType"
        status:
          $ref: "#/components/schemas/EditRequestStatus"
        targetPersonId:
          type: string
          format: uuid
        baseVersion:
          type: integer
        payload:
          type: object
          additionalProperties: true
        requester:
          $ref: "#/components/schemas/User"
        reviewer:
          $ref: "#/components/schemas/User"
        reviewNote:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
    EditRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EditRequest"
        nextCursor:
          type: [string, "null"]
