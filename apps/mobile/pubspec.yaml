name: family_tree
description: "家族族谱 · 多家族 Flutter 移动端原型（iOS / Android）"
publish_to: "none"
version: 0.33.0+38

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  share_plus: ^12.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-SemiBold.ttf
          weight: 600
